<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>AGENTE STAFF</title>
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        padding: 12px;
        margin: 0;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 13px;
        margin-top: 2px;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>AGENTE STAFF</h1>

    <label>URL do backend</label>
    <input id="backendUrl" placeholder="http://localhost:3000" />

    <label>ID do médico (Supabase Auth)</label>
    <input id="doctorId" placeholder="uuid do médico" />

    <button id="startBtn">Iniciar atendimento</button>
    <button id="stopBtn" style="display: none">Encerrar e gerar relatório</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
